<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Base 64</title>
</head>

<body>
    <script>
        // Hàm mã hóa Base64 cho chuỗi Unicode
        function encodeBase64Unicode(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }
        // Hàm giải mã Base64 cho chuỗi Unicode
        function decodeBase64Unicode(encodedStr) {
            return decodeURIComponent(escape(atob(encodedStr)));
        }
        // Sử dụng
        const unicodeId = '1234';
        const encodedUnicodeId = encodeBase64Unicode(unicodeId);
        console.log('Mã hóa Base64 Unicode:', encodedUnicodeId);

        const decodedUnicodeId = decodeBase64Unicode(encodedUnicodeId);
        console.log('Giải mã Base64 Unicode:', decodedUnicodeId);

        async function sha512(message) {
            // Chuyển chuỗi thành mảng byte (Uint8Array)
            const msgUint8 = new TextEncoder().encode(message);
            // Thực hiện hash
            const hashBuffer = await crypto.subtle.digest('SHA-512', msgUint8);
            // Chuyển kết quả từ ArrayBuffer sang mảng byte
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            // Chuyển mảng byte sang chuỗi Hex
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // Sử dụng
        sha512("1234").then(hash => console.log(hash));
    </script>
</body>

</html>
